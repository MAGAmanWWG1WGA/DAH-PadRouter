name: Build DAHPadRouter

on:
  workflow_dispatch:
    inputs:
      ue4ss_ref:
        description: "RE-UE4SS commit or tag to build against (must match the UE4SS in the game)"
        default: "1ceefac8"
  push:
    paths:
      - "DAHPadRouter/**"
      - "xmake.lua"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Let git use your token (only while downloading UE4SS)
        shell: pwsh
        env:
          TOKEN: ${{ secrets.UE4SS_GIT_TOKEN }}
        run: |
          if (-not $env:TOKEN) { Write-Error "The UE4SS_GIT_TOKEN secret is missing (see README step 4)"; exit 1 }
          git config --global url."https://x-access-token:$($env:TOKEN)@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:$($env:TOKEN)@github.com/".insteadOf "git@github.com:"

      - name: Download RE-UE4SS
        shell: pwsh
        env:
          TOKEN: ${{ secrets.UE4SS_GIT_TOKEN }}
        run: |
          $ref = "${{ github.event.inputs.ue4ss_ref }}"
          if (-not $ref) { $ref = "1ceefac8" }
          git clone https://github.com/UE4SS-RE/RE-UE4SS.git RE-UE4SS
          cd RE-UE4SS
          git checkout $ref
          if ($LASTEXITCODE -ne 0) { Write-Error "UE4SS version '$ref' not found"; exit 1 }
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { Write-Error "Submodule download failed: is your GitHub account linked to Epic and the token correct? (README steps 1-4)"; exit 1 }
          # Done with the token: remove it so package downloads use plain public access.
          git config --global --remove-section url."https://x-access-token:$($env:TOKEN)@github.com/"
          # Some packages are listed as git@github.com:... ; the build machine has no SSH key, so use https.
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Put the mod inside UE4SS's project (UE4SS must be the main project)
        shell: pwsh
        run: |
          Copy-Item -Recurse DAHPadRouter RE-UE4SS/DAHPadRouter
          # Remove this repo's wrapper xmake.lua so xmake can't pick it as the main project.
          Remove-Item xmake.lua -ErrorAction SilentlyContinue
          Add-Content RE-UE4SS/xmake.lua "`nincludes(`"DAHPadRouter`")"
          Get-Content RE-UE4SS/xmake.lua -Tail 5

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.9'

      - name: Reuse downloaded packages from earlier runs
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\.xmake\packages
          key: xmake299-packages-${{ github.event.inputs.ue4ss_ref || '1ceefac8' }}

      - name: Set up packages (retries up to 3 times)
        shell: pwsh
        working-directory: RE-UE4SS
        run: |
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            if ($i -lt 3) { xmake f -P . -m "Game__Shipping__Win64" -y }
            else { xmake f -P . -m "Game__Shipping__Win64" -y -vD }   # last try: print full error details
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning::Package setup attempt $i failed, retrying"
          }
          if (-not $ok) {
            Write-Host "===== Package install logs ====="
            Get-ChildItem "$env:LOCALAPPDATA\.xmake\cache\packages" -Recurse -Filter install.txt -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*installdir.failed*' } |
              ForEach-Object { Write-Host "===== $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
            exit 1
          }

      - name: Compile UE4SS and the mod (slow, 1-3 hours the first time)
        shell: pwsh
        working-directory: RE-UE4SS
        run: |
          xmake build -P . -y DAHPadRouter
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter DAHPadRouter.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "DAHPadRouter.dll was not produced"; exit 1 }
          New-Item -ItemType Directory -Force out/DAHPadRouter/dlls | Out-Null
          Copy-Item $dll.FullName out/DAHPadRouter/dlls/main.dll
          Copy-Item DAHPadRouter/config.txt out/DAHPadRouter/dlls/config.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DAHPadRouter
          path: out/
